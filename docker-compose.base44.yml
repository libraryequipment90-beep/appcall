services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - VITE_SIGNALING_URL=https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      signaling:
        condition: service_healthy

  signaling:
    image: node:22
    working_dir: /app/server
    volumes:
      - ./:/app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    command: sh -c "npm install && node --watch index.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
